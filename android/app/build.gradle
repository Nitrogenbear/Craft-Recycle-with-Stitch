// Trusted Web Activity wrapper: the app opens the hosted web app full-screen in Chrome,
// so it always runs the latest version and shares Chrome's saved data for the site.
plugins {
    id 'com.android.application'
}

def versionNumber = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'io.github.nitrogenbear.stitchjobs'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.nitrogenbear.stitchjobs'
        minSdk 21
        targetSdk 34
        versionCode versionNumber
        versionName "1.0.${versionNumber}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'stitch'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
